name: Patch solver timeout and button contrast
on:
  push:
    paths:
      - '.github/scripts/patch_solver_timeout_and_button.py'
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch app
        run: python .github/scripts/patch_solver_timeout_and_button.py
      - name: Syntax check
        run: python -m py_compile streamlit_app.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamlit_app.py
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Fix Showdown solver stalling and button contrast"
            git push
          fi
