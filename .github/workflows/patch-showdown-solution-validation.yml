name: Patch Showdown Solution Validation

on:
  push:
    paths:
      - '.github/workflows/patch-showdown-solution-validation.yml'
      - '.github/scripts/patch_showdown_solution_validation.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch Showdown solution validation
        run: python .github/scripts/patch_showdown_solution_validation.py
      - name: Syntax check
        run: python -m py_compile streamlit_app.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then exit 0; fi
          git add streamlit_app.py
          git commit -m "Reject invalid Showdown solver results"
          git push
