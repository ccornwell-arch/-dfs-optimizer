name: Patch Build Progress and Button Contrast

on:
  push:
    paths:
      - '.github/workflows/patch-build-progress-button.yml'
      - '.github/scripts/patch_build_progress_button.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch build progress and button contrast
        run: python .github/scripts/patch_build_progress_button.py
      - name: Syntax check
        run: python -m py_compile streamlit_app.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then exit 0; fi
          git add streamlit_app.py
          git commit -m "Fix lineup progress display and build button contrast"
          git push
