name: Patch DFS Lab UI Contrast

on:
  push:
    paths:
      - '.github/workflows/patch-ui-contrast.yml'
      - '.github/scripts/patch_ui_contrast.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch UI
        run: python .github/scripts/patch_ui_contrast.py
      - name: Syntax check
        run: python -m py_compile streamlit_app.py
      - name: Commit UI patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then exit 0; fi
          git add streamlit_app.py
          git commit -m "Fix DFS Lab iPad contrast and labels"
          git push
