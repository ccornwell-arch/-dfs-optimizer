name: Patch DFS Lab Agent Intent

on:
  push:
    paths:
      - '.github/workflows/patch-agent-intent.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch intent detection
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('streamlit_app.py')
          s=p.read_text()
          old='''                    challenge=any(x in q for x in ["don't like","dont like","do not like","hate ","not sold","don't want","dont want","get rid","remove ","fade ","off of ","too high","overprojected","over projected","won't score","wont score","won’t score","won't get","wont get","won’t get"])
'''
          new='''                    projection_doubt=(any(x in q for x in ["score","scoring","project","projection","points"]) and any(x in q for x in ["much","high","low","not","wont","won't","won’t","over","under"]))
                    challenge=projection_doubt or any(x in q for x in ["don't like","dont like","do not like","hate ","not sold","don't want","dont want","get rid","remove ","fade ","off of ","too high","overprojected","over projected","won't score","wont score","won’t score","won't get","wont get","won’t get","score that much","score this much"])
'''
          if old not in s:
              raise SystemExit('challenge intent line not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Syntax check
        run: python -m py_compile streamlit_app.py
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then exit 0; fi
          git add streamlit_app.py
          git commit -m "Make DFS Lab recognize projection doubt phrasing"
          git push
