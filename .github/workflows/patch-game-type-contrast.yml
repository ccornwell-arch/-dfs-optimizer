name: Patch Game Type Contrast

on:
  push:
    paths:
      - '.github/workflows/patch-game-type-contrast.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch segmented control contrast
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('streamlit_app.py')
          s=p.read_text()
          marker='/* HIGH-CONTRAST SEGMENTED CONTROLS */'
          if marker not in s:
              css='''
/* HIGH-CONTRAST SEGMENTED CONTROLS */
[data-testid="stSegmentedControl"]{opacity:1!important;}
[data-testid="stSegmentedControl"] label{color:#f7f9fc!important;-webkit-text-fill-color:#f7f9fc!important;opacity:1!important;font-weight:700!important;}
[data-testid="stSegmentedControl"] button,
[data-testid="stSegmentedControl"] [role="radio"],
[data-baseweb="button-group"] button{
  background:#303947!important;
  color:#f7f9fc!important;
  -webkit-text-fill-color:#f7f9fc!important;
  border:1px solid rgba(255,255,255,.28)!important;
  opacity:1!important;
  box-shadow:none!important;
}
[data-testid="stSegmentedControl"] button *,
[data-testid="stSegmentedControl"] [role="radio"] *,
[data-baseweb="button-group"] button *{
  color:#f7f9fc!important;
  -webkit-text-fill-color:#f7f9fc!important;
  opacity:1!important;
}
[data-testid="stSegmentedControl"] button[aria-checked="true"],
[data-testid="stSegmentedControl"] button[aria-pressed="true"],
[data-testid="stSegmentedControl"] [role="radio"][aria-checked="true"],
[data-baseweb="button-group"] button[aria-pressed="true"]{
  background:#2474ed!important;
  color:#fff!important;
  -webkit-text-fill-color:#fff!important;
  border-color:#5a9cff!important;
}
[data-testid="stSegmentedControl"] button:disabled,
[data-testid="stSegmentedControl"] [aria-disabled="true"]{
  opacity:.55!important;
  color:#c3ccd8!important;
  -webkit-text-fill-color:#c3ccd8!important;
}
'''
              needle='</style>'
              pos=s.rfind(needle)
              if pos==-1:
                  raise SystemExit('style closing tag not found')
              s=s[:pos]+css+s[pos:]
              p.write_text(s)
          PY
      - name: Syntax check
        run: python -m py_compile streamlit_app.py
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamlit_app.py
          git commit -m "Improve Game Type control contrast"
          git push
