name: Patch Segmented Control Contrast V2

on:
  push:
    paths:
      - '.github/workflows/patch-segmented-control-contrast-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch segmented control contrast
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('streamlit_app.py')
          s=p.read_text()
          marker='/* SEGMENTED CONTROL CONTRAST V2 */'
          if marker not in s:
              css='''
/* SEGMENTED CONTROL CONTRAST V2 */
[data-testid="stSegmentedControl"] label,
[data-testid="stSegmentedControl"] button,
[data-baseweb="button-group"] button {
  background:#2b3442!important;
  color:#ffffff!important;
  -webkit-text-fill-color:#ffffff!important;
  border:1px solid #5f6b7a!important;
  opacity:1!important;
  font-weight:700!important;
}
[data-testid="stSegmentedControl"] label *,
[data-testid="stSegmentedControl"] button *,
[data-baseweb="button-group"] button * {
  color:#ffffff!important;
  -webkit-text-fill-color:#ffffff!important;
  opacity:1!important;
}
[data-testid="stSegmentedControl"] label:has(input:checked),
[data-testid="stSegmentedControl"] button[aria-checked="true"],
[data-testid="stSegmentedControl"] button[aria-pressed="true"],
[data-testid="stSegmentedControl"] [role="radio"][aria-checked="true"],
[data-baseweb="button-group"] button[aria-pressed="true"] {
  background:#2474ed!important;
  color:#ffffff!important;
  -webkit-text-fill-color:#ffffff!important;
  border-color:#8bb8ff!important;
}
[data-testid="stSegmentedControl"] label:has(input:not(:checked)) {
  background:#2b3442!important;
  color:#ffffff!important;
  -webkit-text-fill-color:#ffffff!important;
}
[data-testid="stSegmentedControl"] label:has(input:not(:checked)) * {
  color:#ffffff!important;
  -webkit-text-fill-color:#ffffff!important;
}
'''
              pos=s.rfind('</style>')
              if pos==-1:
                  raise SystemExit('style closing tag not found')
              s=s[:pos]+css+s[pos:]
              p.write_text(s)
          PY
      - name: Syntax check
        run: python -m py_compile streamlit_app.py
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamlit_app.py
          git commit -m "Fix segmented control text contrast"
          git push
