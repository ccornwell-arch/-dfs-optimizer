name: Patch DFS Lab Agent UX

on:
  push:
    paths:
      - '.github/workflows/patch-dfs-agent.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch agent UX
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('streamlit_app.py')
          s=p.read_text()

          old="if not hits and any(x in q for x in ['he ','him ','his ','one ','them ','those ']):\n                        hits=st.session_state.get('agent_last_players',[])"
          new="if not hits and re.search(r'\\b(?:he|him|his|one|them|those)\\b', q):\n                        hits=st.session_state.get('agent_last_players',[])"
          if old in s:
              s=s.replace(old,new,1)

          old2="""                    if recs:\n                        pr=recs[0]; return f\"**{pr['Name']} is at {float(pr['DFS Lab Proj']):.2f}.** Tell me what you dislike about the play, or I can test removing him from this build and compare the salary-feasible alternatives.\"\n                    return \"I couldn't resolve the player or request from the current slate. Rephrase it with the player's last name and I’ll evaluate that player against this exact lineup instead of giving you a generic lineup summary.\""" 
          new2="""                    projection_high=any(x in q for x in ['too high','overprojected','over projected','projected high','projection is high'])\n                    projection_low=any(x in q for x in ['too low','underprojected','under projected','projected low','projection is low'])\n                    if recs and (projection_high or projection_low):\n                        pr=recs[0]; nm=str(pr['Name']); proj=float(pr['DFS Lab Proj'])\n                        direction='high' if projection_high else 'low'\n                        test1=max(0.0,proj-2.0) if projection_high else proj+2.0\n                        test2=max(0.0,proj-3.0) if projection_high else proj+3.0\n                        return f\"**Yes — you're challenging {nm}'s {proj:.2f} projection as too {direction}.** I would not ask you to repeat why. The next useful step is to stress-test the lineup with {nm} around **{test1:.1f}** and **{test2:.1f}** and see whether he still belongs in this six-player build. Those would be temporary scenario tests, not changes to the base projection.\"\n                    if recs:\n                        pr=recs[0]; return f\"**{pr['Name']} is at {float(pr['DFS Lab Proj']):.2f}.** I can evaluate that projection, compare him with another player, or test removing him from this exact lineup.\"\n                    return \"I couldn't resolve the player or request from the current slate. Rephrase it with the player's last name and I’ll evaluate that player against this exact lineup instead of giving you a generic lineup summary.\""" 
          if old2 in s:
              s=s.replace(old2,new2,1)

          anchor="""                    older=st.session_state['dfs_lab_chat'][:-1]\n                    if older:\n                        with st.expander(f\"Earlier conversation · {len(older)}\",expanded=False):\n                            for uq,ar in reversed(older[-8:]): st.markdown(f\"**You:** {uq}\"); st.markdown(ar); st.divider()\n                if st.session_state.get('dfs_agent_error'):\n"""
          replacement="""                    older=st.session_state['dfs_lab_chat'][:-1]\n                    if older:\n                        with st.expander(f\"Earlier conversation · {len(older)}\",expanded=False):\n                            for uq,ar in reversed(older[-8:]): st.markdown(f\"**You:** {uq}\"); st.markdown(ar); st.divider()\n\n                    with st.form('dfs_lab_agent_followup_form',clear_on_submit=True):\n                        follow_q=st.text_area('Continue the conversation',placeholder='Reply to DFS LAB…',height=80,key='dfs_agent_followup_text')\n                        follow_submit=st.form_submit_button('SEND FOLLOW-UP  ↗',type='primary',use_container_width=True)\n                    if follow_submit and follow_q.strip():\n                        st.session_state['dfs_agent_pending']=follow_q.strip()\n                        st.rerun()\n                if st.session_state.get('dfs_agent_error'):\n"""
          if anchor in s and "dfs_lab_agent_followup_form" not in s:
              s=s.replace(anchor,replacement,1)

          old3="""                    with st.expander('Agent status',expanded=False): st.caption(f\"DFS LAB Agent API fallback is active. Error: {st.session_state.get('dfs_agent_error','unknown')}\")"""
          new3="""                    with st.expander('Agent status',expanded=False):\n                        _agent_err=str(st.session_state.get('dfs_agent_error',''))\n                        if 'credit' in _agent_err.lower() or 'quota' in _agent_err.lower():\n                            st.caption('AI connection is paused because the API account has no remaining credits. DFS LAB is using its built-in analysis until API credits are available.')\n                        else:\n                            st.caption('AI connection is temporarily unavailable. DFS LAB is using its built-in analysis for this response.')"""
          if old3 in s:
              s=s.replace(old3,new3,1)

          footer='st.caption("DFS LAB · Build the story. Test the lineup. Challenge the field.")'
          css="""st.markdown(r'''<style>\n/* Agent readability + follow-up UX */\n[data-testid=\"stExpanderDetails\"]{background:#f7f9fc!important;color:#172235!important;}\n[data-testid=\"stExpanderDetails\"] p,[data-testid=\"stExpanderDetails\"] li,[data-testid=\"stExpanderDetails\"] span{color:#172235!important;-webkit-text-fill-color:#172235!important;}\n[data-testid=\"stExpanderDetails\"] hr{border-color:#c7d2df!important;}\n</style>''',unsafe_allow_html=True)\n\n"""+footer
          if footer in s and 'Agent readability + follow-up UX' not in s:
              s=s.replace(footer,css,1)

          p.write_text(s)
          PY

      - name: Syntax check
        run: python -m py_compile streamlit_app.py

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamlit_app.py
          git commit -m "Fix DFS Lab chat follow-up and readability"
          git push
