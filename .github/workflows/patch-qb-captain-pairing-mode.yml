name: Patch QB Captain Pairing Mode

on:
  push:
    paths:
      - '.github/scripts/patch_qb_captain_pairing_mode.py'
      - '.github/workflows/patch-qb-captain-pairing-mode.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch QB captain pairing mode
        run: python .github/scripts/patch_qb_captain_pairing_mode.py
      - name: Syntax check
        run: python -m py_compile streamlit_app.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then exit 0; fi
          git add streamlit_app.py
          git commit -m "Add min/max QB captain pass catcher options"
          git push
